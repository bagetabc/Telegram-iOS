name: DearTG iOS CI

on:
  push:
    branches: [ deartg-dev ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # Xcode 27 image includes Xcode 27.1 and runs on Apple Silicon.
    runs-on: xcode-27
    timeout-minutes: 360

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Select pinned Xcode
        shell: bash
        run: |
          set -euo pipefail
          XCODE_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["xcode"])')"
          XCODE_PATH="/Applications/Xcode_${XCODE_VERSION}.app/Contents/Developer"
          if [[ ! -d "$XCODE_PATH" ]]; then
            echo "::error::Xcode $XCODE_VERSION is not installed on this runner."
            ls -1 /Applications | grep '^Xcode' || true
            exit 1
          fi
          sudo xcode-select -s "$XCODE_PATH"
          xcodebuild -version
          python3 --version

      - name: Prepare canonical source directory
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /Users/Shared
          sudo rm -rf /Users/Shared/deartg-ios
          cp -R "$GITHUB_WORKSPACE" /Users/Shared/deartg-ios

      - name: Build DearTG iOS
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_DIR=/Users/Shared/deartg-ios
          BAZEL_USER_ROOT="/private/var/tmp/_bazel_containerhost"
          cd "$SOURCE_DIR"

          BUILD_NUMBER_OFFSET="$(cat build_number_offset)"
          APP_VERSION="$(python3 -c 'import json; print(json.load(open("versions.json"))["app"])')"
          COMMIT_COUNT="$(git rev-list --count HEAD)"
          BUILD_NUMBER="$((COMMIT_COUNT + BUILD_NUMBER_OFFSET))"
          echo "BUILD_NUMBER=$BUILD_NUMBER" >> "$GITHUB_ENV"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"

          python3 build-system/Make/ImportCertificates.py --path build-system/fake-codesigning/certs
          python3 -u build-system/Make/Make.py \
            --bazelUserRoot="$BAZEL_USER_ROOT" \
            build \
            --configurationPath="build-system/appstore-configuration.json" \
            --codesigningInformationPath=build-system/fake-codesigning \
            --configuration=release_arm64 \
            --buildNumber="$BUILD_NUMBER"

          OUTPUT_PATH="build/artifacts"
          rm -rf "$OUTPUT_PATH"
          mkdir -p "$OUTPUT_PATH"
          IPA_FOUND=0
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/Telegram.ipa; do
            if [[ -f "$f" ]]; then
              cp "$f" "$OUTPUT_PATH/DearTG.ipa"
              IPA_FOUND=1
              break
            fi
          done
          if [[ "$IPA_FOUND" -ne 1 ]]; then
            echo "::error::Build completed but no IPA was found at the expected Bazel output path."
            find bazel-out -name '*.ipa' -print || true
            exit 1
          fi

          mkdir -p build/DSYMs
          for f in bazel-out/applebin_ios-ios_arm*-opt-ST-*/bin/Telegram/*.dSYM; do
            if [[ -d "$f" ]]; then cp -R "$f" build/DSYMs/; fi
          done
          if [[ -d build/DSYMs ]]; then
            zip -r "$OUTPUT_PATH/DearTG.DSYMs.zip" build/DSYMs >/dev/null
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: DearTG-iOS-${{ github.run_number }}
          path: |
            /Users/Shared/deartg-ios/build/artifacts/DearTG.ipa
            /Users/Shared/deartg-ios/build/artifacts/DearTG.DSYMs.zip
          if-no-files-found: error
          retention-days: 14
