name: DearTG backend checks

on:
  push:
    branches: [deartg-dev]
    paths:
      - "deartg-server/**"
      - ".github/workflows/deartg-backend.yml"
  pull_request:
    branches: [deartg-dev]
    paths:
      - "deartg-server/**"
      - ".github/workflows/deartg-backend.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: deartg-server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: deartg-server/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q app.py tests
      - name: Run API integration tests
        run: PYTHONPATH=. pytest -q
      - name: Verify API imports and route registration
        run: |
          python - <<'PY'
          from app import app
          paths = {route.path for route in app.routes}
          required = {
              "/health",
              "/v1/auth/register",
              "/v1/auth/login",
              "/v1/me",
              "/v1/assets/me",
              "/v1/admin/users",
              "/v1/admin/users/{user_id}/assets",
              "/v1/admin/users/{user_id}/stars",
              "/v1/admin/users/{user_id}/usernames",
              "/v1/admin/numbers",
              "/v1/admin/users/{user_id}/numbers/{number_id}/assign",
              "/v1/admin/users/{user_id}/collectibles",
              "/v1/chats",
              "/v1/chats/{chat_id}/messages",
              "/v1/ws/chats/{chat_id}",
          }
          missing = required - paths
          if missing:
              raise SystemExit(f"Missing API routes: {sorted(missing)}")
          print(f"DearTG API loaded; {len(paths)} routes registered")
          PY
