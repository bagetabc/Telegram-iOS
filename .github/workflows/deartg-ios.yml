name: DearTG iOS simulator build

on:
  push:
    branches: [deartg-dev]
    paths:
      - "DearTG-iOS/**"
      - ".github/workflows/deartg-ios.yml"
  pull_request:
    branches: [deartg-dev]
    paths:
      - "DearTG-iOS/**"
      - ".github/workflows/deartg-ios.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulator:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        working-directory: DearTG-iOS
        run: xcodegen generate
      - name: Build iOS Simulator app
        working-directory: DearTG-iOS
        run: |
          xcodebuild \
            -project DearTG.xcodeproj \
            -scheme DearTG \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build
