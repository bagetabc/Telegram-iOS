name: DearTG
options:
  bundleIdPrefix: com.deartg
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.deartg.app
    INFOPLIST_FILE: Info.plist
    GENERATE_INFOPLIST_FILE: NO
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
targets:
  DearTG:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
