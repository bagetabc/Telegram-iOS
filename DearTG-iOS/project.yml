name: DearTG
options:
  bundleIdPrefix: com.deartg
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.deartg.app
    INFOPLIST_KEY_CFBundleDisplayName: DearTG
    INFOPLIST_KEY_NSLocalNetworkUsageDescription: DearTG connects to your local server on the same Wi-Fi network.
    INFOPLIST_KEY_NSAppTransportSecurity_NSAllowsArbitraryLoads: YES
    GENERATE_INFOPLIST_FILE: YES
targets:
  DearTG:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
