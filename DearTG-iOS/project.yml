name: DearTG
options:
  bundleIdPrefix: com.deartg
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    PRODUCT_BUNDLE_IDENTIFIER: com.deartg.app
    INFOPLIST_KEY_CFBundleDisplayName: DearTG
    INFOPLIST_FILE: Info.plist
    GENERATE_INFOPLIST_FILE: NO
targets:
  DearTG:
    type: application
    platform: iOS
    sources:
      - path: Sources
    settings:
      base:
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
